name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install onesignal-cordova-plugin

      - name: Build Web
        run: |
          mkdir -p www
          cp index.html www/

      - name: Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Upgrade Android SDK to 34
        run: |
          # Ye command automatic build.gradle mein version upgrade kar degi
          sed -i 's/compileSdkVersion = 33/compileSdkVersion = 34/g' android/variables.gradle || true
          sed -i 's/targetSdkVersion = 33/targetSdkVersion = 34/g' android/variables.gradle || true
          # Backup check agar variables.gradle mein na mile
          sed -i 's/compileSdk 33/compileSdk 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk 33/targetSdk 34/g' android/app/build.gradle || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IndiaJobHub-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
