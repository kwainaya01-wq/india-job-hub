name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean Install Dependencies
        run: |
          npm install --force
          npm install onesignal-cordova-plugin --force
          npm install @capacitor/android@latest @capacitor/cli@latest @capacitor/core@latest --force

      - name: Build Web
        run: |
          mkdir -p www
          cp index.html www/

      - name: Sync & Repair Capacitor
        run: |
          # Agar android folder hai toh use delete karke naya banayenge taaki version conflict na ho
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Final SDK and MultiDex Fix
        run: |
          # SDK 34 upgrade
          sed -i 's/compileSdkVersion = 33/compileSdkVersion = 34/g' android/variables.gradle || true
          sed -i 's/targetSdkVersion = 33/targetSdkVersion = 34/g' android/variables.gradle || true
          
          # MultiDex Enable
          sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle || true
          sed -i '/dependencies {/a \    implementation "androidx.multidex:multidex:2.0.1"' android/app/build.gradle || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IndiaJobHub-Final-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
