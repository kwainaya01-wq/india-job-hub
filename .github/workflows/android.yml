name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install onesignal-cordova-plugin
          npm install @capacitor/android@latest @capacitor/cli@latest @capacitor/core@latest

      - name: Build Web
        run: |
          mkdir -p www
          cp index.html www/

      - name: Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Fix MultiDex and SDK 34
        run: |
          # SDK Version update
          [ -f android/variables.gradle ] && sed -i 's/33/34/g' android/variables.gradle || true
          
          # MultiDex enable karna (Asli Fix yahi hai)
          sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle || true
          
          # Implementation add karna build.gradle mein
          sed -i '/dependencies {/a \    implementation "androidx.multidex:multidex:2.0.1"' android/app/build.gradle || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IndiaJobHub-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
