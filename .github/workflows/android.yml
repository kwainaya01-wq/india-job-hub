name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' # Sirf yahan 17 ki jagah 21 kar diya hai

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install --force
          npm install @capacitor/android@latest @capacitor/core@latest @capacitor/cli@latest onesignal-cordova-plugin --force

      - name: Web Build
        run: |
          mkdir -p www
          cp index.html www/

      - name: Create Fresh Android Folder
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: SDK 34 and MultiDex Fix
        run: |
          if [ -d "android" ]; then
            sed -i 's/compileSdkVersion = 33/compileSdkVersion = 34/g' android/variables.gradle || true
            sed -i 's/targetSdkVersion = 33/targetSdkVersion = 34/g' android/variables.gradle || true
            sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle || true
            sed -i '/dependencies {/a \    implementation "androidx.multidex:multidex:2.0.1"' android/app/build.gradle || true
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
                    ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
                    name: IndiaJobHub-V3-New
                  
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
